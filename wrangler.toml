# سيرفر ADWMX الجديد : Worker + قاعدة D1 جديدة فاضية — مفيش أي مستخدمين قدام.
name = "adwmx2"
main = "worker.js"
compatibility_date = "2026-11-05"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "adwmx2"
# بيتكتب تلقائياً بواسطة setup.mjs
database_id = "REPLACE_BY_SETUP"

[vars]
# رقم المطور: له لوحة الإدارة وحذف الحسابات وعلامة التوثيق. (setup.mjs --dev 01xxxxxxxxx بيكتبه)
DEVELOPER_PHONE = ""
# "true" يعرض سبب الخطأ في التطبيق. غيّره لـ "false" بعد ما كل شي يشتغل.
DEBUG = "true"
